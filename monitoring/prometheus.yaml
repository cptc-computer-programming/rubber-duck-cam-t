global:
  scrape_interval: 15s

storage:
  tsdb:
    retention:
      # Remove old blocks when either threshold is reached.
      time: 15d
      # Allow extra disk space for active data and compaction; not a quota.
      size: 2GB

scrape_configs:
  - job_name: open-webui
    static_configs:
      - targets: [otel-collector:8889]
