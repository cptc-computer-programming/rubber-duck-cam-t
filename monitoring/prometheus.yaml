global:
  # Collect fresh samples every 15 seconds for dashboards.
  scrape_interval: 15s

storage:
  tsdb:
    retention:
      # Remove old blocks when either threshold is reached.
      time: 15d
      # Allow extra disk space for active data and compaction; not a quota.
      size: 2GB

scrape_configs:
  # Stable job label for queries; metrics come from the Collector, not WebUI directly.
  - job_name: open-webui
    static_configs:
      - targets: [otel-collector:8889]
  # Check the app itself, independently of its metrics export.
  - job_name: open-webui-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: [http://open-webui:8080/health]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
