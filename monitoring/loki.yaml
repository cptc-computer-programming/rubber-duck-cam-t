# Single-server log storage, reachable only through the Docker network.
auth_enabled: false

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# The compactor actually deletes expired logs; retention alone is insufficient.
compactor:
  retention_enabled: true
  delete_request_store: filesystem

limits_config:
  retention_period: 168h
  # Bound sustained intake to about 6 GiB/week before compression, plus overhead.
  ingestion_rate_mb: 0.01
  ingestion_burst_size_mb: 1

analytics:
  reporting_enabled: false
